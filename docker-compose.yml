services:
  portfolio:
    image: ${IMAGE:-portfolio-nextjs:latest}
    container_name: portfolio
    ports:
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
